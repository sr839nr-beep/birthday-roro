<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday manar</title>

<style>

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
background:#0b0010;
font-family:monospace;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

#count{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:20vw;
font-weight:bold;
color:#ff69d9;
text-shadow:
0 0 20px #ff2fa8,
0 0 50px #b300ff;
opacity:0;
z-index:3;
transition:.3s;
}

#message{
position:absolute;
top:60%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(28px,6vw,80px);
text-align:center;
color:#ffd8f4;
text-shadow:
0 0 20px #ff4fd8,
0 0 50px #b300ff;
opacity:0;
transition:1s;
z-index:3;
}

#cat{
position:absolute;
top:30%;
left:-20%;
font-size:12vw;
opacity:0;
z-index:3;
}

.show{
opacity:1 !important;
}

.dance{
animation:dance .45s infinite alternate;
}

@keyframes dance{
from{
transform:rotate(-15deg) scale(1);
}
to{
transform:rotate(15deg) scale(1.1);
}
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="count"></div>

<div id="cat">🐱</div>

<div id="message">
Happy Birthday<br>
Manar 🎂❤️
</div>

<script>

/* ===== MATRIX BACKGROUND ===== */

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

columns = Math.floor(canvas.width / fontSize);
drops = Array(columns).fill(1);
}

const chars =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*<>[]{}";

const fontSize = 18;

let columns;
let drops;

resize();

window.addEventListener("resize", resize);

function drawMatrix(){

ctx.fillStyle = "rgba(10,0,20,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<drops.length;i++){

const text =
chars[Math.floor(Math.random()*chars.length)];

const hue = 285 + Math.random()*45;

ctx.fillStyle =
`hsl(${hue},100%,65%)`;

ctx.font = fontSize + "px monospace";

ctx.fillText(
text,
i * fontSize,
drops[i] * fontSize
);

if(
drops[i] * fontSize > canvas.height &&
Math.random() > 0.975
){
drops[i] = 0;
}

drops[i]++;
}

requestAnimationFrame(drawMatrix);
}

drawMatrix();

/* ===== COUNTDOWN ===== */

const count = document.getElementById("count");
const cat = document.getElementById("cat");
const message = document.getElementById("message");

function wait(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function start(){

for(let n of ["3","2","1"]){

count.textContent = n;
count.classList.add("show");

await wait(900);

count.classList.remove("show");

await wait(250);
}

/* القطة تظهر */
cat.style.opacity="1";

let pos = -20;

const walk = setInterval(()=>{

pos += 1.5;

cat.style.left = pos + "%";

if(pos >= 42){

clearInterval(walk);

message.classList.add("show");

cat.classList.add("dance");

}

},20);

}

start();

</script>

</body>
</html>,
